[package]
name = "privateroom_olm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["low-level-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
