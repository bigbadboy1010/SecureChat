name: ios-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS build + unit tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: |
          test -f PrivateChat.xcodeproj/project.pbxproj
          plutil -lint Config/Info.plist
          plutil -lint PrivateChat/PrivacyInfo.xcprivacy

      - name: Select available iPhone simulator
        shell: bash
        run: |
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")
          PY
          )"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and test on simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project PrivateChat.xcodeproj -scheme PrivateChat -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO clean test 2>&1 | tee build-test.log

      - name: Release compile gate
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project PrivateChat.xcodeproj -scheme PrivateChat -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build-release.log

      - name: Upload Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securechat-xcode-logs
          path: |
            build-test.log
            build-release.log
          retention-days: 30
