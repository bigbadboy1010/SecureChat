name: ios-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: iOS build + unit tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: |
          test -f PrivateChat.xcodeproj/project.pbxproj
          plutil -lint Config/Info.plist
          plutil -lint PrivateChat/PrivacyInfo.xcprivacy

      - name: Build and test on simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project PrivateChat.xcodeproj             -scheme PrivateChat             -configuration Debug             -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'             CODE_SIGNING_ALLOWED=NO             clean test | tee build-test.log

      - name: Release compile gate
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project PrivateChat.xcodeproj             -scheme PrivateChat             -configuration Release             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build | tee build-release.log

      - name: Upload Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securechat-xcode-logs
          path: |
            build-test.log
            build-release.log
          retention-days: 30
