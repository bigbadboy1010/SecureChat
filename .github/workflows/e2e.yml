name: ios-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS build + unit tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: |
          test -f PrivateChat.xcodeproj/project.pbxproj
          plutil -lint Config/Info.plist
          plutil -lint PrivateChat/PrivacyInfo.xcprivacy

      - name: Select scheme-compatible iPhone simulator
        shell: bash
        run: |
          DESTINATIONS="$(xcodebuild -project PrivateChat.xcodeproj -scheme PrivateChat -showdestinations 2>&1)"
          printf '%s\n' "$DESTINATIONS"
          UDID="$(printf '%s\n' "$DESTINATIONS" | awk -F',' '
            /platform:iOS Simulator/ && /name:iPhone/ {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /id:/) {
                  gsub(/^.*id:[[:space:]]*/, "", $i)
                  gsub(/[[:space:]{}]/, "", $i)
                  print $i
                  exit
                }
              }
            }'
          )"
          test -n "$UDID" || { echo "No scheme-compatible iPhone simulator found" >&2; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using iPhone simulator $UDID"

      - name: Build and test on simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project PrivateChat.xcodeproj -scheme PrivateChat -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO clean test 2>&1 | tee build-test.log

      - name: Release compile gate
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project PrivateChat.xcodeproj -scheme PrivateChat -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build-release.log

      - name: Upload Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securechat-xcode-logs
          path: |
            build-test.log
            build-release.log
          retention-days: 30
