name: sbom

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate client source SBOM
        shell: bash
        run: |
          mkdir -p build/sbom
          python3 - <<'PY'
          import json, pathlib, re, datetime

          pbx = pathlib.Path("PrivateChat.xcodeproj/project.pbxproj").read_text()
          marketing = re.search(r"MARKETING_VERSION = ([^;]+);", pbx)
          version = marketing.group(1).strip().strip('"') if marketing else "unknown"

          files = sorted(
              str(p) for p in pathlib.Path("PrivateChat").rglob("*")
              if p.is_file() and p.suffix in {".swift", ".plist", ".xcprivacy", ".json"}
          )

          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "serialNumber": "urn:uuid:00000000-0000-0000-0000-000000000000",
              "version": 1,
              "metadata": {
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "component": {
                      "type": "application",
                      "name": "SecureChat-iOS",
                      "version": version
                  }
              },
              "components": [],
              "properties": [
                  {"name": "securechat.sourceFileCount", "value": str(len(files))},
                  {"name": "securechat.externalPackageManagerDependencies", "value": "0"}
              ]
          }
          pathlib.Path("build/sbom/securechat-ios.cdx.json").write_text(
              json.dumps(bom, indent=2) + "\n"
          )
          PY

      - name: Validate SBOM JSON
        run: python3 -m json.tool build/sbom/securechat-ios.cdx.json >/dev/null

      - name: Check for committed secret material
        shell: bash
        run: |
          set -e
          if git grep -nE 'RELAY_(AUTH|ADMIN)_TOKEN=[A-Za-z0-9_+/=-]{24,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!Docs/**' ':!*.md'; then
            echo "Potential secret material found in tracked client files." >&2
            exit 1
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: securechat-ios-sbom
          path: build/sbom/
          retention-days: 90
